# Railway / Nixpacks build config for the BINGO Laravel backend.
#
# Nixpacks auto-detects PHP from composer.json (php: ^8.3) — we only
# override two things:
#   1. Install with --no-dev --optimize-autoloader so the prod container
#      isn't carrying phpunit / pint / pail / etc.
#   2. Run migrations + storage:link before the HTTP server starts.
#      `migrate --force` is idempotent (Laravel tracks applied migrations
#      in a `migrations` table), so it's safe to run on every deploy.
#      `storage:link --force` recreates the public/storage symlink each
#      boot, which is what makes the Volume mount actually serve images
#      at /storage/<path>.

[phases.install]
# The FrankenPHP base image ships with a small default extension set
# (ctype/curl/dom/fileinfo/filter/hash/mbstring/openssl/pcre/pdo/session/
# tokenizer/xml/pdo_mysql). `install-php-extensions` is included in the
# image; we extend the set so UploadController::resizeAndStore (GD) and
# the EXIF auto-rotate path on JPEGs work in production.
cmds = [
  "install-php-extensions gd exif",
  "composer install --no-dev --optimize-autoloader --no-interaction",
]

[start]
# NOTE: Railway is configured with a dashboard "Custom Start Command" that
# OVERRIDES this line, so edits here have no effect on the running service.
# To run one-off artisan commands (e.g. data:load to seed media into the
# volume) use the Railway dashboard shell / start command, not this file.
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
