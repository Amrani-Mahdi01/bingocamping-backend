; Per-directory PHP overrides, read automatically by PHP-FPM / LiteSpeed /
; CGI hosts (e.g. Hostinger shared hosting) for requests routed through
; public/index.php. Keeps the upload limits with the code so they don't have
; to be re-applied by hand on every host.
;
; Sized for the one optional product video (compressed client-side, capped at
; 30 MB by UploadController::productVideo). post_max_size must exceed
; upload_max_filesize to leave room for the rest of the multipart body.
;
; NOTE: not honoured by FrankenPHP (Railway) — set these there via the image's
; php.ini if you need to upload videos larger than the default limit during
; the Railway testing phase.
upload_max_filesize = 32M
post_max_size = 36M
